[project]
name = "dataset-browser"
version = "0.1.0"
description = "SQLite database browser with Plotly Dash - query, visualize, and analyze large databases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bids2table>=2.3.1",
    "dash>=3.3.0",
    "dash-bootstrap-components>=2.0.4",
    "fastparquet>=2024.11.0",
    "pandas>=2.3.3",
    "plotly>=5.18.0",
]

[tool.uv]
link-mode = "copy"
